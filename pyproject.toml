[project]
name = "nbalake"
version = "0.1.0"
description = "A local NBA data lake: every free dataset, one identity model, one query surface."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "duckdb>=2.0",
    "pyarrow>=26",
    "httpx>=0.28",
    "typer>=0.15",
    "rich>=13",
    "pytz",
]

[project.optional-dependencies]
analysis = ["polars>=2.0"]

[project.scripts]
nbalake = "nbalake.cli:app"
nba = "nbalake.explore.cli:app"

[dependency-groups]
build = [
    "pyinstaller>=6",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1",
    "polars>=2.0",
    "pytest-xdist>=3",
    "pyarrow-stubs>=20.0.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbalake"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"
